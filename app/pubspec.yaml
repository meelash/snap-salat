name: snap_salat
description: Snap a photo of your masjid's prayer-time display and update its website.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  salat_reader:
    path: ../packages/salat_reader
  snap_salat_api:
    path: ../packages/snap_salat_api
  crypto: ^3.0.3
  flutter_secure_storage: ^11.2.0
  google_mlkit_text_recognition: ^0.17.1
  http: ^1.1.0
  image: ^4.1.3
  image_picker: ^1.0.4
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/registry.json
    - assets/fonts/OFL-Figtree.txt
    - assets/fonts/OFL-ReemKufi.txt
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-400.ttf
          weight: 400
        - asset: assets/fonts/Figtree-600.ttf
          weight: 600
        - asset: assets/fonts/Figtree-700.ttf
          weight: 700
        - asset: assets/fonts/Figtree-800.ttf
          weight: 800
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi-500.ttf
          weight: 500
        - asset: assets/fonts/ReemKufi-700.ttf
          weight: 700
