<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 108 108">
  <!-- Android adaptive icon foreground: inside the 66-unit safe circle, no shutter (it would clip on round masks). -->
  <defs>
    <mask id="crescent">
      <circle cx="51" cy="54" r="12" fill="#fff"/>
      <circle cx="56.5" cy="50.5" r="10.5" fill="#000"/>
    </mask>
  </defs>
  <circle cx="54" cy="54" r="26" fill="none" stroke="#D4AF5F" stroke-width="5"/>
  <circle cx="54" cy="54" r="19" fill="#163A2E"/>
  <circle cx="51" cy="54" r="12" fill="#F1ECDF" mask="url(#crescent)"/>
</svg>
