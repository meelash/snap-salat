name = "snap-salat-relay"
main = "worker.mjs"
compatibility_date = "2026-09-01"

# The last times seen per masjid, so only real changes are announced.
# Create it with `npx wrangler kv namespace create TIMES` and paste the id.
[[kv_namespaces]]
binding = "TIMES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# The Firebase key is a secret, never in this file:
#   npx wrangler secret put FCM_SERVICE_ACCOUNT < service-account.json
