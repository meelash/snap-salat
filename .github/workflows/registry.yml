name: Publish masjid directory

# Rebuilds registry/index.json (what the app downloads) whenever an entry
# is merged, so contributors only need to add their one file.
on:
  push:
    branches: [main]
    paths: [registry/masajid/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-registry.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/index.json app/assets/registry.json
          git commit -m "Rebuild masjid directory index"
          git push
